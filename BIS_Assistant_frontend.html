<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIS Standards Assistant</title>
<style>
    /* Flat, plain, document-first. No gradients, no shadows, no rounded pills,
       no avatars, no animation. The things that were removed are listed at the
       bottom of this block with the reason for each. */
    :root {
        /* Tells the browser to render native widgets -- scrollbars, form controls,
           the PDF viewer's own chrome -- for whichever scheme is in force, instead
           of a white scrollbar down the side of a dark page. */
        color-scheme: light dark;
        --ink: #1a1a1a;
        --ink-soft: #555;
        /* 6b6b6b, not 777: on white #777 measures 4.48:1, just under the 4.5:1 AA
           floor, and this token carries the smallest text on the page (the 11px
           sidebar labels, the language tag, the citation toggle, page numbers).
           The least legible text was also the most numerous. #6b6b6b is 5.33:1
           and looks the same weight. */
        --ink-faint: #6b6b6b;
        --rule: #d8d8d8;
        --rule-soft: #ececec;
        --page: #ffffff;
        --panel: #fafafa;
        --link: #12507d;
        --warn: #8a5300;
        --warn-bg: #fdf6e8;
        --mark-bg: #fef3c7;
        --mark-ink: #555;
        --mark-edge: #fcd34d55;
    }

    /* Every colour in this file is a token, and this block is the only thing that
       has to change to support a second scheme. The pairings are computed, not
       eyeballed, and ui-ux.test.js asserts all of them in both schemes.

       Deliberately not pure black on pure white: #15171b is easier on a long
       document than #000, and #e8e9e7 is easier than #fff. The blues and ambers
       are lightened for a dark ground because the light-scheme values sit at
       roughly 8:1 against white and would fall to about 2:1 here.

       --rule and --rule-soft are hairlines and stay low-contrast on purpose; a
       divider does not need to be readable, only present. */
    @media (prefers-color-scheme: dark) {
        :root {
            --page: #15171b;
            --panel: #1d2024;
            --ink: #e8e9e7;
            --ink-soft: #b9bdc1;
            --ink-faint: #9aa0a6;
            --rule: #33383d;
            --rule-soft: #262a2e;
            --link: #7cb8e8;
            --warn: #e0a64a;
            --warn-bg: #2a2317;
            --mark-bg: #4a3c14;
            --mark-ink: #f2e3bd;
            --mark-edge: #f2e3bd33;
        }
    }
    /* ---- forced themes ----
       The two palettes above, restated, because there is no way to express "use the
       dark values" in CSS except a media query or a selector: color-scheme changes
       what the UA paints, and a media query cannot see an attribute. So the button
       writes data-theme onto <html> and these two blocks key off it.

       The duplication is the price of the design, not an oversight, and it buys three
       things:
         - specificity settles it. :root is (0,1,0) and :root[data-theme] is (0,2,0),
           so an explicit choice always beats the system without !important and
           without depending on which block below happens to come first in the file;
         - color-scheme is pinned per block, because that is the one thing no token
           can carry: scrollbars, the search field and the PDF viewer have to follow
           the scheme that was chosen, not the one the OS reports;
         - nothing changes for anyone who never opens the button. The media query is
           still the whole answer for them, on the first paint and every one after.

       The hazard this creates is drift -- a colour edited in the base palette and
       forgotten here renders stale the moment a choice is made, and nothing in the
       browser complains. So ui-ux.test.js holds this pair to the same contrast list
       as the pair above and diffs their token names and values against the originals.
       Edit all three, or expect the suite to fail. */
    :root[data-theme='light'] {
        color-scheme: only light;
        --ink: #1a1a1a;
        --ink-soft: #555;
        --ink-faint: #6b6b6b;
        --rule: #d8d8d8;
        --rule-soft: #ececec;
        --page: #ffffff;
        --panel: #fafafa;
        --link: #12507d;
        --warn: #8a5300;
        --warn-bg: #fdf6e8;
        --mark-bg: #fef3c7;
        --mark-ink: #555;
        --mark-edge: #fcd34d55;
    }

    :root[data-theme='dark'] {
        color-scheme: only dark;
        --page: #15171b;
        --panel: #1d2024;
        --ink: #e8e9e7;
        --ink-soft: #b9bdc1;
        --ink-faint: #9aa0a6;
        --rule: #33383d;
        --rule-soft: #262a2e;
        --link: #7cb8e8;
        --warn: #e0a64a;
        --warn-bg: #2a2317;
        --mark-bg: #4a3c14;
        --mark-ink: #f2e3bd;
        --mark-edge: #f2e3bd33;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        color: var(--ink);
        background: var(--page);
        -webkit-font-smoothing: antialiased;
    }

    /* ---- header ---- */
    header {
        border-bottom: 1px solid var(--rule);
        padding: 14px 20px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }
    header h1 {
        font-size: 17px; font-weight: 600;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Clamped to one line, and it has to be. This line used to carry every
       document title in the corpus, joined with ", ", so the height of the header
       was a function of the corpus: four rows on a desktop and eight on a phone,
       from the five PDFs in data/pdfs. loadHealth puts counts here now and the
       titles in the tooltip, and this is the backstop for the day a long
       unbroken title is put back into it. `nowrap` rather than a soft wrap
       because a header that grows pushes the whole transcript down the page. */
    header .sub {
        font-size: 13px; color: var(--ink-faint); margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* min-width:0 on both, so the ellipsis above can actually take effect: a flex
       item's default min-width is its content, and a titled header would push
       .head-right off the window instead of truncating. */
    .head-left { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
    .head-title { min-width: 0; }
    .head-right { display: flex; align-items: center; gap: 14px; flex: 0 1 auto; }
    .runtime { font-size: 12px; color: var(--ink-faint); text-align: right; line-height: 1.4; }
    /* Static, non-interactive hint. Deliberately not a <select>: there is nothing
       to choose, because the language follows the question. */
    .anylang {
        font-size: 12px; color: var(--ink-faint); text-align: right;
        margin-top: 2px; padding: 2px 8px; border: 1px solid var(--rule);
        border-radius: 4px; white-space: nowrap;
    }
    /* The theme control. A glyph rather than the word "Dark", for two reasons: the
       button has to name the mode it is in, and a cycling control makes that name
       ambiguous either way (does the label say where you are, or where a press will
       take you?), so the name lives in the title and the accessible label and the
       glyph is the glanceable part. And a word would have to be written in four
       scripts to sit where three glyphs will do.

       The glyphs are three circles that differ only in fill -- empty, half, solid --
       and not a sun and a moon. U+2600 takes emoji presentation on some platforms,
       which would put the one orange glyph on the page and undo the flat,
       document-first rule the rest of this block is written to; the geometric shapes
       cannot. And fill survives a glance with no label, which "light" against "dark"
       also does but a filled sun does not. Sized square so cycling cannot shift the
       header. */
    .theme-btn {
        font: inherit; font-size: 15px; line-height: 1;
        width: 30px; height: 30px; flex: 0 0 auto; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        color: var(--ink-soft); background: var(--page);
        border: 1px solid var(--rule); border-radius: 3px; cursor: pointer;
    }
    .theme-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
    select {
        font: inherit; font-size: 13px; padding: 5px 8px;
        border: 1px solid var(--rule); border-radius: 3px;
        background: var(--page); color: var(--ink); cursor: pointer;
    }
    select:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible {
        outline: 2px solid var(--link); outline-offset: 1px;
    }

    /* ---- layout ---- */
    .wrap { display: flex; align-items: flex-start; min-height: calc(100vh - 66px); }
    aside {
        width: 268px; flex-shrink: 0;
        border-right: 1px solid var(--rule);
        padding: 18px 16px;
        position: sticky; top: 0; align-self: flex-start;
        max-height: 100vh; overflow-y: auto;
    }
    main { flex: 1; min-width: 0; padding: 20px 24px 120px; }

    .side-h {
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
        color: var(--ink-faint); font-weight: 600; margin-bottom: 8px;
    }
    .side-block { margin-bottom: 22px; }
    .side-list { list-style: none; }
    .side-list li { margin: 0 0 1px; }
    /* The two regions that can grow without bound each scroll themselves, and
       their order was changed to match. Both used to sit below a topic list of up
       to 18 entries (suggestionCount 6 x 3, from /api/topics) inside the one
       100vh scroller, so on a short window both the search box and Clear
       transcript were scrolled out of sight -- and the search box is the main way
       to reach a passage. Search first, topics second, the action last, and no
       region can push another off the panel. The aside keeps its own
       max-height/overflow as the backstop for the case where they add up anyway.

       The caps are in vh rather than px so they follow the window: 40vh of result
       cards is roughly four of the eight, and 34vh of topics is a dozen. */
    #searchResults { margin-top: 8px; max-height: 40vh; overflow-y: auto; }
    #topicList { max-height: 34vh; overflow-y: auto; }
    .side-foot { border-top: 1px solid var(--rule-soft); padding-top: 14px; }
    .side-btn {
        display: block; width: 100%; text-align: left;
        font: inherit; font-size: 13px; line-height: 1.4;
        background: none; border: none; border-radius: 3px;
        padding: 5px 7px; cursor: pointer; color: var(--link);
    }
    .side-btn:hover { background: var(--panel); text-decoration: underline; }
    .side-btn .code { color: var(--ink-faint); }
    .side-input {
        width: 100%; font: inherit; font-size: 13px; padding: 6px 8px;
        border: 1px solid var(--rule); border-radius: 3px; background: var(--page);
    }
    .plain-btn {
        font: inherit; font-size: 13px; background: none; cursor: pointer;
        border: 1px solid var(--rule); border-radius: 3px; padding: 5px 10px; color: var(--ink-soft);
    }
    .plain-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
    .side-note { font-size: 12px; color: var(--ink-faint); }
    /* A result card is a <button>, so it carries the button resets the same way
       .side-btn does: a button does not inherit font, centres its text, and sizes
       to its content, none of which is wanted here. This is the difference between
       a passage you can find with the keyboard and one you can only reach with a
       mouse -- and the search results are the main way to find a passage. */
    .dir-card {
        display: block; width: 100%; text-align: left; font: inherit;
        border: 1px solid var(--rule-soft); border-radius: 3px;
        padding: 8px 9px; margin-bottom: 6px; cursor: pointer; background: var(--page);
    }
    .dir-card:hover { border-color: var(--ink-faint); }
    /* A button's content model is phrasing content, so these are spans made block
       by this rule rather than the divs they replaced. */
    .dir-card .t { display: block; font-size: 13px; font-weight: 600; }
    .dir-card .m { display: block; font-size: 11px; color: var(--ink-faint); margin: 1px 0 3px; }
    .dir-card .p { display: block; font-size: 12px; color: var(--ink-soft); }

    /* ---- transcript ---- */
    /* 68ch on the turn, not on the answer. Uncapped, the transcript ran the full
       width of the window -- roughly 1600px of line on a wide monitor, well past
       the 60-80ch that is comfortable to read. Capping the turn rather than just
       the prose means the question, the answer and the timing line share one
       measure instead of the question spanning the window while the answer sat in
       a narrow column. It also caps the rule between turns, which is the honest
       version: a full-width divider above 68ch of text reads as though the page
       were wider than the content.

       Centred, and every direct child of main is centred with it. The column used
       to sit hard against the sidebar, so a wide monitor had ~700px of dead space
       to the right of the answer with nothing in it. Centring is what lets the
       composer centre on the same axis: main's content box and the composer's are
       both "268px to the right edge, less 24px of padding", so one measure and
       auto margins on both put the Ask button beside the text instead of 700px
       away from it.

       68ch is a literal in both rules rather than a token, on purpose:
       ui-ux.test.js reads the number out of this block to hold the measure inside
       the 55-80ch band, and the composer's copy is the same literal so the two
       cannot drift. Change one, change both. */
    .turn {
        padding: 16px 0; border-bottom: 1px solid var(--rule-soft);
        max-width: 68ch; margin-inline: auto;
    }
    .turn:last-child { border-bottom: none; }
    .q { font-weight: 600; font-size: 15px; }
    /* break-word rather than anywhere for prose: anywhere can break inside an
       ordinary word, and an answer contains IS numbers, clause references and the
       occasional long token that should wrap but not shatter. */
    .a { margin-top: 8px; overflow-wrap: break-word; }
    .tag {
        display: inline-block; font-size: 11px; font-weight: 400;
        color: var(--ink-faint); border: 1px solid var(--rule);
        border-radius: 3px; padding: 0 5px; margin-left: 8px; vertical-align: 2px;
    }
    .a p { margin: 0 0 9px; }
    .a ul, .a ol { margin: 0 0 9px; padding-left: 20px; }
    .a li { margin: 2px 0; }
    .a h4 {
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
        color: var(--ink-faint); margin: 12px 0 5px;
    }
    .a .cite { font-size: 11px; color: var(--link); }
    /* `anywhere` here, matching the drawer, because these are the long document
       titles ("SP 21 - Summaries of Indian Standards for Building Materials and
       Construction") rather than prose. Unbroken, they forced the whole
       transcript to scroll sideways on a narrow screen. */
    .src {
        font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere;
        border-top: 1px solid var(--rule-soft); margin-top: 12px; padding-top: 8px;
    }
    .src ol { padding-left: 18px; }
    .loc {
        border-left: 2px solid var(--rule); padding: 2px 0 2px 11px; margin: 0 0 11px;
    }
    .ask-suggestion {
        font: inherit; font-size: 13px; background: none; border: none;
        padding: 0; color: var(--link); cursor: pointer; text-align: left;
        text-decoration: underline;
    }
    .ask-suggestion:hover { text-decoration: none; }

    /* Citation affordances. A page reference that cannot be opened is only
       marginally better than no page reference, so the number is a real link
       into the source PDF. Understated on purpose: it sits inside a citation
       line that is already dense, and it should read as "this is checkable"
       rather than as another button competing for attention. */
    .cite-link {
        color: var(--link); text-decoration: underline; text-underline-offset: 2px;
        text-decoration-thickness: 1px; border-radius: 2px;
    }
    .cite-link:hover { text-decoration-thickness: 2px; }
    .cite-link:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

    /* The passage text, revealed so a claim can be checked against what the
       model actually read rather than taken on trust. */
    .cite-panel { margin: 4px 0 2px; }
    .cite-toggle {
        font-size: 11px; color: var(--ink-faint); cursor: pointer;
        list-style: none; display: inline-block; padding: 1px 0;
        border-bottom: 1px dotted var(--rule);
    }
    .cite-toggle::-webkit-details-marker { display: none; }
    .cite-toggle::before { content: '+ '; font-weight: 700; }
    .cite-panel[open] > .cite-toggle::before { content: '− '; }
    .cite-toggle:hover { color: var(--link); }
    .cite-toggle:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .cite-excerpt {
        margin: 5px 0 2px; padding: 7px 9px; border-left: 2px solid var(--rule-soft);
        background: var(--panel); font-size: 12px; line-height: 1.55;
        color: var(--ink-soft); white-space: pre-wrap; max-height: 340px;
        overflow-y: auto; border-radius: 0 3px 3px 0;
    }
    /* The cited clause. Warm rather than the link blue, so a highlight in the
       passage is never mistaken for a control.
       --mark-ink is pinned rather than inherited: the fill is light in the
       light scheme, so `color: inherit` would put light text on a light fill the
       moment the page inverts. Both schemes are verified in ui-ux.test.js
       (6.70:1 light, 8.47:1 dark). */
    .cite-excerpt mark {
        background: var(--mark-bg); color: var(--mark-ink); padding: 0 2px; border-radius: 2px;
        font-weight: 600; box-shadow: 0 0 0 1px var(--mark-edge);
    }

    /* ---- in-page source viewer ----
       A fixed overlay, not a column in .wrap. Sizing the transcript instead would
       reflow every open and close, and the chat is long enough already. */
    .cite-viewer { position: fixed; inset: 0; z-index: 40; }
    /* Closed state is visibility, not display, so the panel can transition. The
       panel is also inert (set by the script) to keep its links out of the tab
       order while it is off screen. */
    .cite-viewer { visibility: hidden; transition: visibility 0s linear .18s; }
    .cite-viewer.open { visibility: visible; transition: visibility 0s; }

    .cite-viewer-scrim {
        position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent);
        opacity: 0; transition: opacity .18s ease;
    }
    .cite-viewer.open .cite-viewer-scrim { opacity: 1; }

    .cite-viewer-panel {
        position: absolute; top: 0; right: 0; height: 100%;
        width: min(520px, 100vw);
        display: flex; flex-direction: column;
        background: var(--page); border-left: 1px solid var(--rule);
        box-shadow: -8px 0 24px color-mix(in srgb, var(--ink) 10%, transparent);
        transform: translateX(100%); transition: transform .18s ease;
    }
    .cite-viewer.open .cite-viewer-panel { transform: translateX(0); }

    .cite-viewer-head {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 13px 14px 11px; border-bottom: 1px solid var(--rule-soft);
    }
    .cite-viewer-titles { flex: 1; min-width: 0; }
    .cite-viewer-doc {
        font-size: 13px; font-weight: 600; color: var(--ink);
        /* Document titles are long; wrap rather than push the close button out. */
        overflow-wrap: anywhere;
    }
    .cite-viewer-meta { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
    .cite-viewer-x {
        flex-shrink: 0; width: 26px; height: 26px; line-height: 1;
        font-size: 19px; color: var(--ink-faint);
        background: none; border: 1px solid transparent; border-radius: 3px;
        cursor: pointer;
    }
    .cite-viewer-x:hover { color: var(--ink); background: var(--panel); border-color: var(--rule); }
    .cite-viewer-x:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

    /* The passage, capped so the document keeps most of the panel. Scrolls. */
    .cite-viewer-excerpt {
        flex-shrink: 0; max-height: 26vh; overflow-y: auto;
        padding: 11px 14px; border-bottom: 1px solid var(--rule-soft);
        background: var(--panel); font-size: 12px; line-height: 1.55;
        color: var(--ink-soft); white-space: pre-wrap;
    }
    .cite-viewer-excerpt mark {
        background: var(--mark-bg); color: var(--mark-ink); padding: 0 2px; border-radius: 2px;
        font-weight: 600; box-shadow: 0 0 0 1px var(--mark-edge);
    }
    .cite-viewer-frame { flex: 1; width: 100%; border: 0; background: var(--panel); }

    .cite-viewer-foot {
        flex-shrink: 0; display: flex; align-items: center; gap: 10px;
        padding: 8px 14px; border-top: 1px solid var(--rule-soft);
        font-size: 11px; color: var(--ink-faint);
    }
    .cite-viewer-note { flex: 1; }
    .cite-viewer-newtab { color: var(--link); white-space: nowrap; }

    /* The sidebar is a drawer at this width and closed by default, so the viewer
       takes the whole screen rather than sitting beside a panel the reader has to
       dismiss before reading the passage. */
    @media (max-width: 860px) {
        .cite-viewer-panel { width: 100vw; }
        .cite-viewer-excerpt { max-height: 30vh; }
    }
    @media (prefers-reduced-motion: reduce) {
        .cite-viewer, .cite-viewer-scrim, .cite-viewer-panel { transition: none; }
        aside, .side-scrim { transition: none; }
    }

    .notice {
        border: 1px solid color-mix(in srgb, var(--warn) 32%, var(--page)); background: var(--warn-bg); color: var(--warn);
        padding: 9px 11px; border-radius: 3px; font-size: 13px; margin-bottom: 9px;
        /* The same measure and the same centring as a turn, so a failure is a band
           across the reading column rather than a small box floating in the middle
           of a wide one. */
        max-width: 68ch; margin-inline: auto;
    }
    .thinking { color: var(--ink-faint); font-size: 14px; }

    /* ---- composer ---- */
    .composer {
        position: fixed; left: 268px; right: 0; bottom: 0;
        border-top: 1px solid var(--rule); background: var(--page); padding: 12px 24px;
    }
    /* Capped and centred to the reading column, matching .turn. Uncapped, the
       input ran the full width of the window and put the Ask button out in the
       empty space to the right of the answer, which is also where the eye is not.
       Same 68ch literal, same reason it is a literal. */
    .composer .inner {
        display: flex; gap: 8px; max-width: 68ch; margin-inline: auto;
    }
    .composer input {
        flex: 1; font: inherit; padding: 8px 10px;
        border: 1px solid var(--rule); border-radius: 3px; background: var(--page);
    }
    .composer button {
        font: inherit; font-size: 14px; padding: 8px 18px; cursor: pointer;
        background: var(--ink); color: var(--page); border: 1px solid var(--ink); border-radius: 3px;
    }
    .composer button:disabled { opacity: .55; cursor: default; }

    .intro { color: var(--ink-soft); }

    /* ---- the index drawer ----
       Everything in this block is off above 860px, where the sidebar is a column
       in the layout and needs no trigger. Below it, the sidebar is an overlay
       rather than a column: it is the only route to passage search and to the
       topic list, and `aside { display: none }` at this width made two features
       simply not exist on the device people read a standards answer on. Same
       contract as the citation viewer above, deliberately: the same scrim, the
       same closed state as visibility rather than display so the panel can
       transition and stays out of the tab order while it is off screen, the same
       reduced-motion opt-out. */
    .side-toggle, .side-top, .side-scrim { display: none; }
    .side-toggle {
        font: inherit; font-size: 13px; background: none; cursor: pointer;
        border: 1px solid var(--rule); border-radius: 3px; padding: 6px 10px;
        color: var(--ink-soft); white-space: nowrap; flex-shrink: 0;
    }
    .side-toggle:hover { border-color: var(--ink-faint); color: var(--ink); }
    .side-x {
        width: 32px; height: 32px; line-height: 1; font-size: 19px;
        color: var(--ink-faint); background: none; cursor: pointer;
        border: 1px solid var(--rule); border-radius: 3px;
    }
    .side-x:hover { color: var(--ink); background: var(--panel); }
    .side-x:focus-visible, .side-toggle:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

    @media (max-width: 860px) {
        .side-toggle { display: inline-flex; align-items: center; }
        /* The drawer's own close control. A scrim tap is the other route and
           Escape the third, but a scrim is not a control a first-time user looks
           for, and Escape does not exist on a phone at all. */
        .side-top { display: flex; justify-content: flex-end; margin: -4px 0 8px; }

        .side-scrim {
            display: block; position: fixed; inset: 0; z-index: 45;
            background: color-mix(in srgb, var(--ink) 35%, transparent);
            opacity: 0; visibility: hidden;
            transition: opacity .18s ease, visibility 0s linear .18s;
        }
        .side-scrim.on { opacity: 1; visibility: visible; transition: opacity .18s ease; }

        /* Above the scrim, and above the citation viewer, so the two cannot end
           up in a stack that looks broken. They cannot actually be open at once
           in any case: each makes the other's trigger inert while it is up, and
           the drawer marks the transcript inert too. */
        aside {
            position: fixed; top: 0; bottom: 0; left: 0; z-index: 46;
            width: min(300px, 86vw); max-height: none; overflow-y: auto;
            background: var(--page);
            box-shadow: 6px 0 24px color-mix(in srgb, var(--ink) 10%, transparent);
            transform: translateX(-100%); visibility: hidden;
            transition: transform .18s ease, visibility 0s linear .18s;
        }
        aside.open {
            transform: translateX(0); visibility: visible;
            transition: transform .18s ease;
        }

        /* 44px is the smallest box a finger reliably hits. The send button was
           36px and a sidebar row 30px, which on a phone is a miss often enough to
           be worth the extra row height. */
        .composer button { padding: 11px 20px; }
        .composer input { padding: 11px 10px; }
        .side-btn { padding: 9px 7px; }
        .dir-card { padding: 10px; }
        .plain-btn { padding: 9px 12px; }
        /* The theme control is the only button in the header, and 30px is a miss on
           a phone. It grows here rather than the header getting taller, because it
           is already as tall as the two text lines beside it. */
        .theme-btn { width: 44px; height: 44px; }

        .composer { left: 0; }
        main { padding: 16px 16px 110px; }
    }

    /* Removed, and why:
       - .msg-icon circular "AI" avatar badges on every message — the single
         clearest sign of a chat template; a transcript needs no portrait.
       - pill-shaped composer with a circular send button that scaled on hover.
       - blinking scaling typing dots; replaced by one plain "Thinking…" line.
       - glowing green "Systems Active" dot with a box-shadow bloom.
       - navy sidebar, per-item SVG icons, and a fade-up animation on each message.
       - soft shadows on every surface and 16px radii.
       - the camera and mic buttons. Their handlers, handleImageUpload and
         startDictation, were never defined anywhere in the file, so both threw a
         ReferenceError on click. There is no OCR or speech path behind them: a
          camera would need a vision model this machine cannot fit alongside the
          generator, and the browser speech API used by the mic would stream audio
          to a cloud service, which contradicts running fully locally.
       - `chatBox.scrollTop = chatBox.scrollHeight`, in three places. The transcript
          has no height of its own, so the document scrolls and main cannot be
          scrolled programmatically: every one of those assignments was a no-op. A
          turn reached the viewport only because it also called scrollIntoView, and
          notice() did not, which is why an error could render below the fold.
       - `.intro ul` and `.intro li`, which styled a bulleted list in the empty
          state. emptyState is a single sentence and has never contained a list, so
          nothing could select those two rules.
       - the send button's `disabled` state during a generation. It was a dead end
          -- a local model can take tens of seconds and there was no way to stop it.
          The button is Stop now, and `inflight` is what guards a second Enter.
       - `aside { display: none }` below 860px. It made the sidebar the one part
         of the interface that did not exist on a phone, and the sidebar is the
         only route to passage search and to the topic list -- the same two
         features a hardcoded sidebar was rebuilt around. It is an overlay at that
         width now, on the citation viewer's terms. See "the index drawer". */
</style>
</head>
<body>

<header>
    <div class="head-left">
        <!-- The one way into the sidebar below 860px, where it is a drawer. Above
             that width this is display:none, because the sidebar is already on
             screen and a trigger there would be a second control that does
             nothing. aria-expanded and aria-controls are the state contract;
             openSidebar/closeSidebar own both ends of it. -->
        <button type="button" class="side-toggle" id="sideToggle"
                onclick="toggleSidebar()" aria-expanded="false" aria-controls="sidePanel"
                data-i18n="openIndex" data-i18n-aria="openIndex">Index</button>
        <div class="head-title">
            <h1 data-i18n="appTitle">BIS Standards Assistant</h1>
            <div class="sub" id="corpusLine"></div>
        </div>
    </div>
    <div class="head-right">
        <div class="runtime" id="runtimeLine"></div>
        <!-- Light, dark, or whatever the system says. The glyph is the current mode
             and the title and accessible name are filled from the i18n tables by
             paintTheme(), which also owns the data-theme attribute on <html>: the
             attribute is only ever set for an explicit choice, so its absence is what
             "system" means and the prefers-color-scheme block stays in charge
             otherwise. No data-i18n here on purpose -- applyLanguage would overwrite
             a label that depends on the mode. In the header rather than the sidebar
             because it has to be reachable without opening the drawer. -->
        <button type="button" class="theme-btn" id="themeBtn"
                onclick="cycleTheme()" title="Theme: system">◐</button>
        <!-- No language selector. It existed only to drive the i18n tables below,
             and it had to be found before the interface would speak your language.
             The server now detects the script of what you type and reports it back
             in meta.lang, which switches these tables automatically, so the hint
             only has to advertise a capability that actually works. -->
        <div class="anylang" title="Hindi · Telugu · English">Ask in any language</div>
    </div>
</header>

<div class="wrap">
    <!-- The sidebar's scrim. A sibling of the drawer rather than a child of it,
         because it has to cover the page the drawer is drawn over. display:none
         above 860px, so a stale .on left by a rotation cannot grey out the app. -->
    <div class="side-scrim" id="sideScrim" aria-hidden="true"></div>

    <!-- Order is load-bearing, not cosmetic: search first because it is the main
         route to a passage, then the topic list, then the one destructive action.
         See #searchResults and #topicList for the caps that stop either region
         from pushing the others off the panel. -->
    <aside id="sidePanel" data-i18n-aria="openIndex" aria-label="Index">
        <div class="side-top">
            <button type="button" class="side-x" data-side-close
                    data-i18n-aria="closeIndex" aria-label="Close index">&times;</button>
        </div>

        <div class="side-block">
            <div class="side-h" data-i18n="searchHeader">Search passages</div>
            <input type="text" class="side-input" id="stdSearch"
                   data-i18n-placeholder="searchPlaceholder"
                   placeholder="e.g. clay paving bricks" oninput="onSearchInput()">
            <div id="searchResults"></div>
        </div>

        <div class="side-block">
            <div class="side-h" data-i18n="topicsHeader">In this index</div>
            <ul class="side-list" id="topicList"></ul>
            <div class="side-note" id="topicNote"></div>
        </div>

        <div class="side-foot">
            <button class="plain-btn" onclick="clearChat()" data-i18n="clearChat">Clear transcript</button>
        </div>
    </aside>

    <main id="chatBox"></main>
</div>

<!-- In-page source viewer. A slide-over rather than a new tab so the answer stays
     on screen next to the page it cites.
     The iframe is the browser's own PDF viewer: no PDF.js, no new dependency. That
     costs us two things and both are worked around in the markup below -- the
     route must send Content-Disposition:inline or the frame triggers a download
     instead of rendering, and #page= seeking inside a frame is reliable in
     Chrome/Edge/Firefox but unverified in Safari. The excerpt above the frame and
     the "open in new tab" link are what keep this honest when that fails. -->
<div class="cite-viewer" id="citeViewer" aria-hidden="true" inert>
    <div class="cite-viewer-scrim" data-cite-close></div>
    <aside class="cite-viewer-panel" role="dialog" aria-modal="true" aria-labelledby="citeViewerTitle">
        <div class="cite-viewer-head">
            <div class="cite-viewer-titles">
                <div class="cite-viewer-doc" id="citeViewerTitle"></div>
                <div class="cite-viewer-meta" id="citeViewerMeta"></div>
            </div>
            <button type="button" class="cite-viewer-x" data-cite-close
                    data-i18n-aria="closeSource" aria-label="Close source">&times;</button>
        </div>
        <!-- The exact passage that was read, shown before the document so the claim
             is checkable even if the frame below never paints. -->
        <div class="cite-viewer-excerpt" id="citeViewerExcerpt"></div>
        <!-- src is set by the script on first open and cleared on close, so a 7.5 MB
             PDF is never fetched on page load and is released when you dismiss it. -->
        <iframe class="cite-viewer-frame" id="citeViewerFrame" title="Source document"></iframe>
        <div class="cite-viewer-foot">
            <span class="cite-viewer-note" data-i18n="pageNote">The page number is the PDF page, not the printed folio.</span>
            <a class="cite-viewer-newtab" id="citeViewerNewTab" target="_blank" rel="noopener"
               data-i18n="openNewTab">Open in new tab</a>
        </div>
    </aside>
</div>

<div class="composer">
    <div class="inner">
        <input type="text" id="userInput" autocomplete="off"
               data-i18n-placeholder="askPlaceholder"
               placeholder="Ask about a standard, a clause, or an IS number"
               onkeydown="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="onSendClick()" data-i18n="askButton">Ask</button>
    </div>
</div>

  "serverError": "సర్వర్ దీనికి సమాధానం ఇవ్వలేకపోయింది. దయచేసి మళ్లీ ప్రయత్నించండి.",
  "noResults": "సరిపోలిక భాగం లేదు.",
  "directoryHint": "ఇండెక్స్ చేసిన భాగాల్లో వెతకడానికి టైప్ చేయండి.",
  "directorySearching": "వెతుకుతున్నాయి…",
  "directoryError": "BIS సర్వర్‌ను చేరుకోలేకపోయాము.",
  "metaLine": "{ms} ms · ఉత్తమ సరిపోలిక {score}"
}</script>

<script>
'use strict';

const LANGS = ['en', 'hi', 'pa', 'te'];
const I18N = Object.fromEntries(
    LANGS.map((l) => [l, JSON.parse(document.getElementById('i18n-' + l).textContent)])
);

let lang = 'en';
const t = (key) => I18N[lang][key] ?? I18N.en[key] ?? key;
const fill = (key, vars) =>
    Object.entries(vars).reduce((s, [k, v]) => s.split('{' + k + '}').join(String(v)), t(key));

// Served from the same origin as the API, but the file also has to work when
// opened straight from disk, where "/api/..." would resolve to file:///api/...
const API_BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';

const chatBox = document.getElementById('chatBox');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Suggestion buttons arrive as server-rendered HTML inside an answer, so they are
// wired by delegation. Reading data-ask rather than an inline onclick also means a
// title containing an apostrophe cannot break out of a JS string literal.
//
// Delegation is bound to all three lists that can hold a button. Binding it only to
// the transcript looked fine and left the whole sidebar inert: the topic buttons in
// #topicList and the passage cards in #searchResults are siblings of the transcript,
// not descendants, so no click ever reached the handler.
for (const host of [chatBox, document.getElementById('topicList'), document.getElementById('searchResults')]) {
    host.addEventListener('click', (e) => {
        const b = e.target.closest('.ask-suggestion, .side-btn, .dir-card');
        if (b && b.dataset.ask) {
            e.preventDefault();
            ask(b.dataset.ask);
        }
    });
}

/* ---------- index drawer ----------
   Below 860px the sidebar is an overlay rather than a column, because it is the
   only route to passage search and to the topic list and `display: none` at that
   width made both of them absent on a phone. It keeps the same contract as the
   citation viewer below, on purpose: inert background, focus moved in, focus
   returned, Escape out, and three ways to close that do not involve a reload. */

const sidePanel = document.getElementById('sidePanel');
const sideToggle = document.getElementById('sideToggle');
const sideScrim = document.getElementById('sideScrim');

// 'main' rather than the viewer's '.wrap', and the difference is load-bearing:
// the drawer is a child of .wrap, so marking .wrap inert would take the drawer
// down along with the page it is meant to be covering.
const sideBackground = ['header', 'main', '.composer']
    .map((sel) => document.querySelector(sel))
    .filter(Boolean);

const NARROW_QUERY = '(max-width: 860px)';
let sideOpen = false;

function toggleSidebar() {
    if (sideOpen) closeSidebar();
    else openSidebar();
}

function openSidebar() {
    if (sideOpen) return;
    sideOpen = true;
    sidePanel.classList.add('open');
    sideScrim.classList.add('on');
    sideToggle.setAttribute('aria-expanded', 'true');
    // Background before focus, for the reason the viewer does it: the toggle is
    // inside `header`, and the browser blurs it as `header` goes inert, so
    // moving focus on the same tick leaves no frame with focus nowhere.
    sideBackground.forEach((el) => el.setAttribute('inert', ''));
    // The × , not the search box. Opening the drawer on a phone is as often about
    // browsing the topic list, and focusing a text field raises the on-screen
    // keyboard over the drawer the reader was trying to look at.
    sidePanel.querySelector('.side-x').focus();
}

function closeSidebar() {
    if (!sideOpen) return;
    sideOpen = false;
    sidePanel.classList.remove('open');
    sideScrim.classList.remove('on');
    sideToggle.setAttribute('aria-expanded', 'false');
    // Lifted before the focus restore: the trigger is inside `header`, and
    // focusing a descendant of an inert subtree silently does nothing.
    sideBackground.forEach((el) => el.removeAttribute('inert'));
    sideToggle.focus();
}

sideScrim.addEventListener('click', closeSidebar);

// Two reasons to close from inside the panel. The × is the explicit control; the
// second is the one that is easy to forget -- picking a topic or a search result
// asks the question, and the answer renders in the transcript *behind* the
// drawer, so leaving it open hides the thing that was just asked for.
sidePanel.addEventListener('click', (e) => {
    if (e.target.closest('[data-side-close], [data-ask]')) closeSidebar();
});

/* Closing on the way out of the narrow range. Above 860px the drawer rules stop
   applying and the sidebar is a static column again -- but the `inert` set on the
   background is script, not CSS, so without this a tablet rotating out of portrait
   would leave the whole app dead to clicks and to focus. */
window.matchMedia(NARROW_QUERY).addEventListener('change', (e) => {
    if (!e.matches) closeSidebar();
});

/* ---------- theme ---------- */

// Three modes rather than two, and that is the whole design decision. A two-state
// toggle leaves anyone who wants the page to go back to following their system with
// no way to say so, and "system" is the state every install starts in -- so it has
// to be reachable, not just escapable.
const THEME = {
    auto: { glyph: '◐', nameKey: 'modeAuto' },
    light: { glyph: '○', nameKey: 'modeLight' },
    dark: { glyph: '●', nameKey: 'modeDark' },
};
const THEME_MODES = Object.keys(THEME);
const THEME_STORE_KEY = 'bis-theme';
const themeBtn = document.getElementById('themeBtn');
let themeMode = 'auto';

function readStoredTheme() {
    // Wrapped because localStorage throws outright, not just returns null, in a
    // sandboxed frame and in some privacy modes, and a theme switch is not worth a
    // page that will not boot. An unreadable or unrecognised value falls back to
    // "system", which is also the safe answer: it is the one mode that needs
    // nothing remembered about the person who set it.
    try {
        const saved = localStorage.getItem(THEME_STORE_KEY);
        return THEME_MODES.includes(saved) ? saved : 'auto';
    } catch (e) {
        return 'auto';
    }
}

function paintTheme() {
    // The attribute is only ever *set*, never cleared to a value: "system" is its
    // absence. That is what lets prefers-color-scheme keep answering on its own for
    // everyone who has not made a choice, including on the very first paint, before
    // this script has run.
    if (themeMode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', themeMode);

    themeBtn.textContent = THEME[themeMode].glyph;
    // One key for the whole label, so the button names the mode it is in rather than
    // the one a press would move to. With a cycle, "what does this do" is only
    // answerable by pressing it, and an accessible name has to stand on its own.
    const label = fill('themeLabel', { mode: t(THEME[themeMode].nameKey) });
    themeBtn.title = label;
    themeBtn.setAttribute('aria-label', label);
}

function cycleTheme() {
    themeMode = THEME_MODES[(THEME_MODES.indexOf(themeMode) + 1) % THEME_MODES.length];
    paintTheme();
    try {
        localStorage.setItem(THEME_STORE_KEY, themeMode);
    } catch (e) { /* not fatal: the page has already switched, it just will not persist */ }
}

/* ---------- in-page source viewer ---------- */

const citeViewer = document.getElementById('citeViewer');
const citeFrame = document.getElementById('citeViewerFrame');
const citeTitle = document.getElementById('citeViewerTitle');
const citeMeta = document.getElementById('citeViewerMeta');
const citeExcerpt = document.getElementById('citeViewerExcerpt');
const citeNewTab = document.getElementById('citeViewerNewTab');

// The link that opened the viewer, so focus can go back where it came from.
let citeReturnFocus = null;

// Everything the modal covers. The panel declares aria-modal="true", which is a
// promise that focus and assistive technology stay inside it -- but nothing was
// keeping that promise, so Tab walked straight out of the dialog and into the
// transcript behind the scrim. Marking the rest of the document inert while the
// drawer is open is the way to actually keep it, and it is cheaper and more
// robust than a hand-rolled keydown trap: native, so it also stops a screen
// reader reading the background, and it reuses the mechanism already used on the
// panel itself.
const citeBackground = ['header', '.wrap', '.composer']
    .map((sel) => document.querySelector(sel))
    .filter(Boolean);

// The clause is re-marked here rather than shipped as markup, because the server
// already renders a marked copy into the <details> panel and a second rendered
// copy in an attribute would be a third thing to keep in sync.
//
// The escaping round trip is the whole reason this function exists in this shape.
// pageLink() writes escapeHtml(content) into data-excerpt so the *attribute* is
// safe, but reading it back through `dataset` resolves the entities again, so
// what arrives here is the raw passage -- and the next line puts it into innerHTML.
// A PDF is untrusted input: without re-escaping, a passage containing
// <img src=x onerror=...> would be parsed into a live element in this drawer. The
// server's escapeHtml() cannot help with that, because decoding undoes it.
//
// So the passage and the clause are both escaped here, and the search runs on the
// escaped forms -- the same thing citationPanel() does on the server. That is what
// makes esc() and escapeHtml() load-bearing: they have to replace the same five
// characters the same way, or the drawer and the inline panel would mark different
// spans for one citation and the same quote would look different in the two places.
// test/citations.test.js runs this function against citationPanel() so they cannot
// drift, and covers the injection case.
//
// A clause that is absent gets no highlight, which is the same outcome the server
// produces. Same rule as citationPanel(): the *first* occurrence only.
function markClause(excerpt, clause) {
    const text = String(excerpt == null ? '' : excerpt).trim();
    if (!text) return '';
    const body = esc(text);
    const needle = clause ? esc(String(clause).trim()) : '';
    if (!needle) return body;
    const at = body.indexOf(needle);
    if (at < 0) return body;
    return body.slice(0, at) + '<mark>' + body.slice(at, at + needle.length) + '</mark>' + body.slice(at + needle.length);
}

function openCite(link) {
    const d = link.dataset;
    citeTitle.textContent = d.title || d.doc;
    citeMeta.textContent = (d.clause ? 'cl. ' + d.clause + ' · ' : '') + 'p. ' + d.page;
    citeExcerpt.innerHTML = markClause(d.excerpt || '', d.clause || '');
    citeNewTab.href = link.href;

    // Assigned per open rather than kept, so the previous document is unloaded
    // when a different citation is chosen.
    const want = '/api/documents/' + encodeURIComponent(d.doc) + '/pdf#page=' + encodeURIComponent(d.page);
    if (citeFrame.getAttribute('src') !== want) citeFrame.setAttribute('src', want);

    if (!citeViewer.classList.contains('open')) {
        citeReturnFocus = link;
        citeViewer.classList.add('open');
        citeViewer.setAttribute('aria-hidden', 'false');
        // inert while off screen would hide it from the tab order, but the panel is
        // visible during the transition, so it is removed once open and set on close.
        citeViewer.removeAttribute('inert');
        // Background first, then focus. The link that opened this lives inside
        // .wrap, so the browser blurs it as it goes inert; moving focus on the
        // same tick leaves no frame in which focus is nowhere.
        citeBackground.forEach((el) => el.setAttribute('inert', ''));
        citeViewer.querySelector('.cite-viewer-x').focus();
    }
}

function closeCite() {
    if (!citeViewer.classList.contains('open')) return;
    citeViewer.classList.remove('open');
    citeViewer.setAttribute('aria-hidden', 'true');
    citeViewer.setAttribute('inert', '');
    // Cleared so a 7.5 MB PDF is released instead of being held for the session.
    citeFrame.removeAttribute('src');
    // Lifted before the focus restore, not after: the element we are about to
    // return focus to is a citation link inside .wrap, and focusing a descendant
    // of an inert subtree silently does nothing.
    citeBackground.forEach((el) => el.removeAttribute('inert'));
    if (citeReturnFocus) {
        citeReturnFocus.focus();
        citeReturnFocus = null;
    }
}

// One delegated handler covers the answer, the near-match reply and the located
// reply, because .cite-link is rendered into all three by the server.
chatBox.addEventListener('click', (e) => {
    const link = e.target.closest('a.cite-link[data-doc]');
    if (!link) return;
    // Modified clicks are left alone so middle-click and ctrl-click still open a
    // new tab, which is the behaviour a plain link is expected to have.
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    openCite(link);
});

document.getElementById('citeViewer').addEventListener('click', (e) => {
    if (e.target.closest('[data-cite-close]')) closeCite();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeCite();
    // Both surfaces, not just the viewer. Escape is the only keyboard route out of
    // an overlay, and a drawer left open behind a closed viewer is a panel sitting
    // over the page with the scrim still up.
    if (e.key === 'Escape' && sideOpen) closeSidebar();
});

/* ---------- transcript ---------- */

function emptyState() {
    chatBox.innerHTML = '<div class="turn"><div class="intro">' + esc(t('emptyState')) + '</div></div>';
}

/* The transcript has no height constraint of its own, so the *document* scrolls
   and `main` cannot be scrolled programmatically. Two consequences, both of which
   used to be bugs: assigning chatBox.scrollTop did nothing, and an appended turn
   only reached the viewport because turn() called scrollIntoView. */
const NEAR_BOTTOM_PX = 80;

function readerAtBottom() {
    // Measured against the document, not chatBox, for the reason above.
    if (typeof document === 'undefined' || typeof window === 'undefined') return true;
    const gap = document.documentElement.scrollHeight - (window.scrollY + window.innerHeight);
    return gap <= NEAR_BOTTOM_PX;
}

function scrollToEnd() {
    // Instant, not smooth. This file removes motion rather than adding it, and a
    // jump that follows your eye is less disorienting than an eased one that
    // arrives after you have started reading.
    chatBox.scrollIntoView({ block: 'end' });
}

function turn(queryHtml, answerHtml, tagKey, meta) {
    // Sampled before the append, because appending changes the document height
    // and would therefore make the measurement meaningless.
    const stick = readerAtBottom();
    const div = document.createElement('div');
    div.className = 'turn';
    const tag = tagKey ? '<span class="tag">' + esc(t(tagKey)) + '</span>' : '';
    const metaLine = meta
        ? '<div class="side-note" style="margin-top:8px">' +
          esc(fill('metaLine', { ms: meta.ms, score: meta.score })) + '</div>'
        : '';
    // The server sanitises everything it renders and the only markup in `answerHtml`
    // is the server's own, so it is injected as-is. The query is escaped here
    // because it is echoed straight back from what the user typed.
    div.innerHTML =
        '<div class="q">' + queryHtml + tag + '</div>' +
        '<div class="a">' + answerHtml + '</div>' +
        metaLine;
    chatBox.appendChild(div);
    // Only if the reader was already at the bottom. The workflow this UI exists
    // for is scroll up, open a citation, check the clause against the passage --
    // so an answer arriving must never drag the viewport off what is being read.
    if (stick) scrollToEnd();
    return div;
}

function notice(html) {
    const d = document.createElement('div');
    d.className = 'notice';
    d.innerHTML = html;
    chatBox.appendChild(d);
    // Unconditionally, unlike a turn. This is a failure, and a failure that
    // renders quietly below the fold is worse than no notice at all: it looks
    // like the question simply went unanswered.
    scrollToEnd();
    return d;
}

/* The request currently in flight, so that it can be cancelled. The send button
   used to be disabled for the whole of a generation with no way out, which on a
   local model that takes tens of seconds is a dead end with a spinner. */
let inflight = null;

/* The button is two buttons depending on the state, so its label is set from the
   i18n table rather than baked into the markup. It is also re-set in the finally
   block below, because applyLanguage() rewrites every data-i18n element when the
   server answers in another language, and the label has to agree with whatever
   language the interface ended up in. */
function setSendLabel(key) {
    sendBtn.textContent = t(key);
}

function stopAsk() {
    if (inflight) inflight.abort();
}

function onSendClick() {
    if (inflight) stopAsk();
    else send();
}

async function send() {
    const text = input.value.trim();
    if (!text) return;
    // Enter during a generation must not start a second request. Cancelling is the
    // button's job, which is why the button is not disabled any more.
    if (inflight) return;

    input.value = '';
    setSendLabel('stopButton');
    const controller = new AbortController();
    inflight = controller;
    if (!chatBox.querySelector('.turn')) emptyState();
    const pending = turn(esc(text), '<div class="thinking">' + esc(t('thinking')) + '</div>', null, null);

    try {
        const res = await fetch(API_BASE + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // 'auto', not `lang`. The server reads the script of the text itself, so
            // a Hindi question is translated and answered in Hindi whatever this
            // client last displayed. Sending the current UI language instead is what
            // made a Hindi question sent against the default `lang: 'en'` skip
            // translation altogether.
            body: JSON.stringify({ query: text, lang: 'auto' }),
            signal: controller.signal,
        });
        const data = await res.json();

        if (!res.ok) {
            pending.remove();
            notice(esc(data.error || t('serverError')));
            return;
        }

        const m = data.meta || {};

        // Follow the language actually used. The server answers in the script of the
        // question, so the interface should agree with the reply it just rendered —
        // otherwise a Hindi answer arrives wrapped in an English panel. Guarded on
        // difference so the common case (same language) touches no DOM.
        if (m.lang && m.lang !== lang) applyLanguage(m.lang);

        // Four genuinely different outcomes, previously all rendered as the same
        // plain bubble: the user could not tell a refusal from an outage.
        let tag = 'tagAnswer';
        if (m.degraded) tag = 'tagUnavailable';
        else if (m.band === 'located') tag = 'tagLocated';
        else if (m.band === 'bridge') tag = 'tagNearMiss';
        else if (m.band === 'miss' || m.notFound) tag = 'tagNotFound';

        const meta =
            m.total !== undefined
                ? { ms: m.total, score: m.topSimilarity !== undefined ? m.topSimilarity : '—' }
                : null;

        pending.remove();
        turn(esc(text), data.answer, tag, meta);
    } catch (err) {
        pending.remove();
        if (err && err.name === 'AbortError') {
            // The reader asked for this, so nothing is reported as wrong. The typed
            // question goes back in the composer rather than being dropped: they
            // cancelled the wait, not the question.
            input.value = text;
        } else {
            notice(esc(t('connError')));
        }
    } finally {
        inflight = null;
        setSendLabel('askButton');
        input.focus();
    }
}

function ask(text) {
    input.value = text;
    send();
}

function clearChat() {
    // Cancelled first, or the in-flight answer arrives into a transcript that has
    // just been emptied and appends itself to the empty state.
    stopAsk();
    emptyState();
    input.focus();
}

/* ---------- sidebar ---------- */

async function loadTopics() {
    const list = document.getElementById('topicList');
    const note = document.getElementById('topicNote');
    try {
        const res = await fetch(API_BASE + '/api/topics');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
          list.innerHTML = data.topics
              .map((x) =>
                  '<li><button class="side-btn" data-ask="' +
                  esc('What does clause ' + x.title + ' of ' + x.docTitle + ' say?') +
                  '">clause ' + esc(x.title) + ' <span class="code">' + esc(x.docTitle) + '</span></button></li>')
              .join('');
        note.textContent = t('topicsNote');
    } catch (err) {
        list.innerHTML = '';
        note.textContent = t('topicsError');
    }
}

const SEARCH_DEBOUNCE_MS = 300;
const SEARCH_MIN_CHARS = 3;
let searchTimer = null;
let searchSeq = 0;

function onSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, SEARCH_DEBOUNCE_MS);
}

function dirNote(text) {
    document.getElementById('searchResults').innerHTML =
        '<div class="side-note">' + esc(text) + '</div>';
}

/* The card used to be a div with a click handler, which made the passage search
   reachable by mouse only -- and that search is the main way to find a passage.
   It is a button now, so it is focusable, reachable with Enter and Space, and
   announced as a control. The delegated handler matches on .dir-card, so the
   click path itself needed no change.

   The trailing ellipsis used to be appended unconditionally, so a 40-character
   preview ended in a "…" that claimed a truncation that had not happened, and the
   fixed 150-character slice could land inside a word -- or, in the Devanagari and
   Telugu this app is actually used in, inside a grapheme cluster, leaving a broken
   glyph. Both are handled by cutting back to the last space. */
function trimPreview(text, max) {
    const s = String(text == null ? '' : text);
    if (s.length <= max) return s;
    const cut = s.slice(0, max);
    const space = cut.lastIndexOf(' ');
    // The floor stops a long unbreakable token (a URL, a chemical string) from
    // collapsing the card to a single word.
    return (space > max * 0.6 ? cut.slice(0, space) : cut).replace(/\s+$/, '') + '…';
}

async function runSearch() {
    const q = document.getElementById('stdSearch').value.trim();
    const seq = ++searchSeq;
    const box = document.getElementById('searchResults');

    if (q.length < SEARCH_MIN_CHARS) {
        dirNote(t('directoryHint'));
        return;
    }

    dirNote(t('directorySearching'));
    try {
        const res = await fetch(API_BASE + '/api/search?q=' + encodeURIComponent(q) + '&k=8');
        const data = await res.json();
        if (seq !== searchSeq) return;
        if (!res.ok) throw new Error(data.error);
        if (!data.results.length) {
            dirNote(t('noResults'));
            return;
        }
        box.innerHTML = data.results
            .map((r) => {
                const pages = r.pages.length > 1 ? r.pages[0] + '–' + r.pages[1] : r.pages[0];
                const ask =
                    r.clause ? 'Tell me about ' + r.docTitle + ', clause ' + r.clause
                             : 'Tell me about ' + r.docTitle;
                return '<button type="button" class="dir-card" data-ask="' + esc(ask) + '">' +
                    '<span class="t">' + esc(r.docTitle) + '</span>' +
                    '<span class="m">' + esc('cl. ' + (r.clause || '—') + ' · p. ' + pages) + '</span>' +
                    '<span class="p">' + esc(trimPreview(r.preview, 150)) + '</span></button>';
            })
            .join('');
    } catch (err) {
        if (seq !== searchSeq) return;
        dirNote(t('directoryError'));
    }
}

/* ---------- header ---------- */

async function loadHealth() {
    const el = document.getElementById('runtimeLine');
    try {
        const res = await fetch(API_BASE + '/api/health');
        const d = await res.json();
        const c = d.config || {};
        // The active provider/model pair, read from the same config the server
        // runs on. It previously reported Gemini models on a fully local install,
        // which made it impossible to tell from the UI what was actually running.
        if (c.embedModel && c.genModel) {
            el.textContent = fill('runtimeLine', {
                embed: c.embedProvider + '/' + c.embedModel,
                gen: c.genProvider + '/' + c.genModel,
            });
        } else {
            el.textContent = t('runtimeUnknown');
        }

        if (d.corpus) {
            const pages = (d.corpus.documents || []).reduce((n, x) => n + (x.pageCount || 0), 0);
            const titles = (d.corpus.documents || []).map((x) => x.docTitle);
            const line = document.getElementById('corpusLine');
            // Counts, not the whole title list. This line used to join every
            // document title in the corpus with ", ", so the height of the header
            // was a function of how much had been ingested: four rows on a desktop
            // and eight on a phone, from the five PDFs in data/pdfs. The titles
            // are still one hover away, which is all they were ever for -- the line
            // identifies the corpus, and the sidebar lists the same set anyway.
            line.textContent = fill('corpusLine', {
                docs: titles.length,
                pages,
                chunks: d.corpus.chunkCount,
            });
            line.title = titles.join(' · ');
        }
    } catch (err) {
        el.textContent = t('connError');
    }
}

/**
 * Swap the interface language.
 *
 * This used to be `setLanguage(next)` and was only ever called by the language
 * <select>, which meant the interface spoke your language only if you went looking
 * for the dropdown first. There is no dropdown now: the server detects the script
 * of the question, answers in it, and returns it in `meta.lang`, and this is
 * called from the response handler when that differs from what is on screen.
 *
 * The `loadTopics`/`loadHealth` calls that used to be in here are gone. They
 * existed only to re-label the sidebar after a manual switch, and they were the
 * reason `test/directory.test.js` had to assert that changing language does not
 * spend an embedding call. Topics are data rather than labels, so relabelling
 * cannot invalidate them and nothing needs re-fetching.
 */
function applyLanguage(next) {
    lang = LANGS.includes(next) ? next : 'en';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
        const v = I18N[lang][el.getAttribute('data-i18n')];
        if (v) el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
        const v = I18N[lang][el.getAttribute('data-i18n-placeholder')];
        if (v) el.placeholder = v;
    });
    // data-i18n only sets textContent, so attributes need their own pass. Used by
    // the source viewer's close button, whose accessible name must translate too.
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
        const v = I18N[lang][el.getAttribute('data-i18n-aria')];
        if (v) el.setAttribute('aria-label', v);
    });
    document.getElementById('topicNote').textContent = t('topicsNote');
    document.getElementById('stdSearch').placeholder = t('searchPlaceholder');
    // The theme button's label contains a mode name, so it cannot go through the
    // data-i18n pass above and has to be repainted here, like the two id-based lines
    // next to it.
    paintTheme();
    // Relabelling the search box invalidates whatever it was showing.
    if (!document.getElementById('stdSearch').value.trim()) dirNote(t('directoryHint'));
    input.focus();
}

// First paint. Topics and health are loaded here rather than from inside
// applyLanguage: they were only ever fetched from there to relabel the sidebar
// after a manual language switch, and with detection driving the language there is
// no manual switch to relabel for. Fetching once, here, is also what stops the
// startup doubling where these ran twice on first paint.
// The theme is read first because applyLanguage paints the button's label, and
// that label names the mode.
themeMode = readStoredTheme();
applyLanguage('en');
loadTopics();
loadHealth();
emptyState();
</script>
</body>
</html>
