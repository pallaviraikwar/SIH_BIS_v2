<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIS Standards Assistant</title>
<style>
    /* Flat, plain, document-first. No gradients, no shadows, no rounded pills,
       no avatars, no animation. The things that were removed are listed at the
       bottom of this block with the reason for each. */
    :root {
        --ink: #1a1a1a;
        --ink-soft: #555;
        --ink-faint: #777;
        --rule: #d8d8d8;
        --rule-soft: #ececec;
        --page: #ffffff;
        --panel: #fafafa;
        --link: #12507d;
        --warn: #8a5300;
        --warn-bg: #fdf6e8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        color: var(--ink);
        background: var(--page);
        -webkit-font-smoothing: antialiased;
    }

    /* ---- header ---- */
    header {
        border-bottom: 1px solid var(--rule);
        padding: 14px 20px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }
    header h1 { font-size: 17px; font-weight: 600; }
    header .sub { font-size: 13px; color: var(--ink-faint); margin-top: 2px; }
    .head-right { display: flex; align-items: center; gap: 14px; }
    .runtime { font-size: 12px; color: var(--ink-faint); text-align: right; line-height: 1.4; }
    select {
        font: inherit; font-size: 13px; padding: 5px 8px;
        border: 1px solid var(--rule); border-radius: 3px;
        background: #fff; color: var(--ink); cursor: pointer;
    }
    select:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible {
        outline: 2px solid var(--link); outline-offset: 1px;
    }

    /* ---- layout ---- */
    .wrap { display: flex; align-items: flex-start; min-height: calc(100vh - 66px); }
    aside {
        width: 268px; flex-shrink: 0;
        border-right: 1px solid var(--rule);
        padding: 18px 16px;
        position: sticky; top: 0; align-self: flex-start;
        max-height: 100vh; overflow-y: auto;
    }
    main { flex: 1; min-width: 0; padding: 20px 24px 120px; }

    .side-h {
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
        color: var(--ink-faint); font-weight: 600; margin-bottom: 8px;
    }
    .side-block { margin-bottom: 22px; }
    .side-list { list-style: none; }
    .side-list li { margin: 0 0 1px; }
    .side-btn {
        display: block; width: 100%; text-align: left;
        font: inherit; font-size: 13px; line-height: 1.4;
        background: none; border: none; border-radius: 3px;
        padding: 5px 7px; cursor: pointer; color: var(--link);
    }
    .side-btn:hover { background: var(--panel); text-decoration: underline; }
    .side-btn .code { color: var(--ink-faint); }
    .side-input {
        width: 100%; font: inherit; font-size: 13px; padding: 6px 8px;
        border: 1px solid var(--rule); border-radius: 3px; background: #fff;
    }
    .plain-btn {
        font: inherit; font-size: 13px; background: none; cursor: pointer;
        border: 1px solid var(--rule); border-radius: 3px; padding: 5px 10px; color: var(--ink-soft);
    }
    .plain-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
    .side-note { font-size: 12px; color: var(--ink-faint); }
    .dir-card {
        border: 1px solid var(--rule-soft); border-radius: 3px;
        padding: 8px 9px; margin-bottom: 6px; cursor: pointer; background: #fff;
    }
    .dir-card:hover { border-color: var(--ink-faint); }
    .dir-card .t { font-size: 13px; font-weight: 600; }
    .dir-card .m { font-size: 11px; color: var(--ink-faint); margin: 1px 0 3px; }
    .dir-card .p { font-size: 12px; color: var(--ink-soft); }

    /* ---- transcript ---- */
    .turn { padding: 16px 0; border-bottom: 1px solid var(--rule-soft); }
    .turn:last-child { border-bottom: none; }
    .q { font-weight: 600; font-size: 15px; }
    .tag {
        display: inline-block; font-size: 11px; font-weight: 400;
        color: var(--ink-faint); border: 1px solid var(--rule);
        border-radius: 3px; padding: 0 5px; margin-left: 8px; vertical-align: 2px;
    }
    .a { margin-top: 8px; }
    .a p { margin: 0 0 9px; }
    .a ul, .a ol { margin: 0 0 9px; padding-left: 20px; }
    .a li { margin: 2px 0; }
    .a h4 {
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
        color: var(--ink-faint); margin: 12px 0 5px;
    }
    .a .cite { font-size: 11px; color: var(--link); }
    .src {
        font-size: 12px; color: var(--ink-soft);
        border-top: 1px solid var(--rule-soft); margin-top: 12px; padding-top: 8px;
    }
    .src ol { padding-left: 18px; }
    .loc {
        border-left: 2px solid var(--rule); padding: 2px 0 2px 11px; margin: 0 0 11px;
    }
    .ask-suggestion {
        font: inherit; font-size: 13px; background: none; border: none;
        padding: 0; color: var(--link); cursor: pointer; text-align: left;
        text-decoration: underline;
    }
    .ask-suggestion:hover { text-decoration: none; }
    .notice {
        border: 1px solid #e3d3ae; background: var(--warn-bg); color: var(--warn);
        padding: 9px 11px; border-radius: 3px; font-size: 13px; margin-bottom: 9px;
    }
    .thinking { color: var(--ink-faint); font-size: 14px; }

    /* ---- composer ---- */
    .composer {
        position: fixed; left: 268px; right: 0; bottom: 0;
        border-top: 1px solid var(--rule); background: #fff; padding: 12px 24px;
    }
    .composer .inner { display: flex; gap: 8px; }
    .composer input {
        flex: 1; font: inherit; padding: 8px 10px;
        border: 1px solid var(--rule); border-radius: 3px; background: #fff;
    }
    .composer button {
        font: inherit; font-size: 14px; padding: 8px 18px; cursor: pointer;
        background: var(--ink); color: #fff; border: 1px solid var(--ink); border-radius: 3px;
    }
    .composer button:disabled { background: #999; border-color: #999; cursor: default; }

    .intro { color: var(--ink-soft); }
    .intro ul { padding-left: 20px; margin: 6px 0 0; }
    .intro li { margin: 3px 0; }

    @media (max-width: 860px) {
        aside { display: none; }
        .composer { left: 0; }
        main { padding: 16px 16px 110px; }
    }

    /* Removed, and why:
       - .msg-icon circular "AI" avatar badges on every message — the single
         clearest sign of a chat template; a transcript needs no portrait.
       - pill-shaped composer with a circular send button that scaled on hover.
       - blinking scaling typing dots; replaced by one plain "Thinking…" line.
       - glowing green "Systems Active" dot with a box-shadow bloom.
       - navy sidebar, per-item SVG icons, and a fade-up animation on each message.
       - soft shadows on every surface and 16px radii.
       - the camera and mic buttons. Their handlers, handleImageUpload and
         startDictation, were never defined anywhere in the file, so both threw a
         ReferenceError on click. There is no OCR or speech path behind them: a
         camera would need a vision model this machine cannot fit alongside the
         generator, and the browser speech API used by the mic would stream audio
         to a cloud service, which contradicts running fully locally. */
</style>
</head>
<body>

<header>
    <div>
        <h1 data-i18n="appTitle">BIS Standards Assistant</h1>
        <div class="sub" id="corpusLine"></div>
    </div>
    <div class="head-right">
        <div class="runtime" id="runtimeLine"></div>
        <select id="languageSelect" onchange="setLanguage(this.value)">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="pa">ਪੰਜਾਬੀ</option>
            <option value="te">తెలుగు</option>
        </select>
    </div>
</header>

<div class="wrap">
    <aside>
        <div class="side-block">
            <div class="side-h" data-i18n="topicsHeader">In this index</div>
            <ul class="side-list" id="topicList"></ul>
            <div class="side-note" id="topicNote"></div>
        </div>

        <div class="side-block">
            <div class="side-h" data-i18n="searchHeader">Search passages</div>
            <input type="text" class="side-input" id="stdSearch"
                   data-i18n-placeholder="searchPlaceholder"
                   placeholder="e.g. clay paving bricks" oninput="onSearchInput()">
            <div id="searchResults" style="margin-top:8px"></div>
        </div>

        <button class="plain-btn" onclick="clearChat()" data-i18n="clearChat">Clear transcript</button>
    </aside>

    <main id="chatBox"></main>
</div>

<div class="composer">
    <div class="inner">
        <input type="text" id="userInput" autocomplete="off"
               data-i18n-placeholder="askPlaceholder"
               placeholder="Ask about a standard, a clause, or an IS number"
               onkeydown="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="send()" data-i18n="askButton">Ask</button>
    </div>
</div>

<script>
'use strict';

const LANGS = ['en', 'hi', 'pa', 'te'];
const I18N = Object.fromEntries(
    LANGS.map((l) => [l, JSON.parse(document.getElementById('i18n-' + l).textContent)])
);

let lang = 'en';
const t = (key) => I18N[lang][key] ?? I18N.en[key] ?? key;
const fill = (key, vars) =>
    Object.entries(vars).reduce((s, [k, v]) => s.split('{' + k + '}').join(String(v)), t(key));

// Served from the same origin as the API, but the file also has to work when
// opened straight from disk, where "/api/..." would resolve to file:///api/...
const API_BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';

const chatBox = document.getElementById('chatBox');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Suggestion buttons arrive as server-rendered HTML inside an answer, so they are
// wired by delegation. Reading data-ask rather than an inline onclick also means a
// title containing an apostrophe cannot break out of a JS string literal.
//
// Delegation is bound to all three lists that can hold a button. Binding it only to
// the transcript looked fine and left the whole sidebar inert: the topic buttons in
// #topicList and the passage cards in #searchResults are siblings of the transcript,
// not descendants, so no click ever reached the handler.
for (const host of [chatBox, document.getElementById('topicList'), document.getElementById('searchResults')]) {
    host.addEventListener('click', (e) => {
        const b = e.target.closest('.ask-suggestion, .side-btn, .dir-card');
        if (b && b.dataset.ask) {
            e.preventDefault();
            ask(b.dataset.ask);
        }
    });
}

/* ---------- transcript ---------- */

function emptyState() {
    chatBox.innerHTML = '<div class="turn"><div class="intro">' + esc(t('emptyState')) + '</div></div>';
}

function turn(queryHtml, answerHtml, tagKey, meta) {
    const div = document.createElement('div');
    div.className = 'turn';
    const tag = tagKey ? '<span class="tag">' + esc(t(tagKey)) + '</span>' : '';
    const metaLine = meta
        ? '<div class="side-note" style="margin-top:8px">' +
          esc(fill('metaLine', { ms: meta.ms, score: meta.score })) + '</div>'
        : '';
    // The server sanitises everything it renders and the only markup in `answerHtml`
    // is the server's own, so it is injected as-is. The query is escaped here
    // because it is echoed straight back from what the user typed.
    div.innerHTML =
        '<div class="q">' + queryHtml + tag + '</div>' +
        '<div class="a">' + answerHtml + '</div>' +
        metaLine;
    chatBox.appendChild(div);
    chatBox.scrollIntoView({ block: 'end' });
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

function notice(html) {
    const d = document.createElement('div');
    d.className = 'notice';
    d.innerHTML = html;
    chatBox.appendChild(d);
    chatBox.scrollTop = chatBox.scrollHeight;
    return d;
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    sendBtn.disabled = true;
    if (!chatBox.querySelector('.turn')) emptyState();
    const pending = turn(esc(text), '<div class="thinking">' + esc(t('thinking')) + '</div>', null, null);

    try {
        const res = await fetch(API_BASE + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: text, lang }),
        });
        const data = await res.json();

        if (!res.ok) {
            pending.remove();
            notice(esc(data.error || t('serverError')));
            return;
        }

        const m = data.meta || {};
        // Four genuinely different outcomes, previously all rendered as the same
        // plain bubble: the user could not tell a refusal from an outage.
        let tag = 'tagAnswer';
        if (m.degraded) tag = 'tagUnavailable';
        else if (m.band === 'located') tag = 'tagLocated';
        else if (m.band === 'bridge') tag = 'tagNearMiss';
        else if (m.band === 'miss' || m.notFound) tag = 'tagNotFound';

        const meta =
            m.total !== undefined
                ? { ms: m.total, score: m.topSimilarity !== undefined ? m.topSimilarity : '—' }
                : null;

        pending.remove();
        turn(esc(text), data.answer, tag, meta);
    } catch (err) {
        pending.remove();
        notice(esc(t('connError')));
    } finally {
        sendBtn.disabled = false;
        input.focus();
    }
}

function ask(text) {
    input.value = text;
    send();
}

function clearChat() {
    emptyState();
    input.focus();
}

/* ---------- sidebar ---------- */

async function loadTopics() {
    const list = document.getElementById('topicList');
    const note = document.getElementById('topicNote');
    try {
        const res = await fetch(API_BASE + '/api/topics');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        list.innerHTML = data.topics
            .map((x) =>
                '<li><button class="side-btn" data-ask="' +
                esc('What is ' + x.isCode + ' ' + x.title + '?') +
                '">' + esc(x.title) + ' <span class="code">' + esc(x.isCode) + '</span></button></li>')
            .join('');
        note.textContent = t('topicsNote');
    } catch (err) {
        list.innerHTML = '';
        note.textContent = t('topicsError');
    }
}

const SEARCH_DEBOUNCE_MS = 300;
const SEARCH_MIN_CHARS = 3;
let searchTimer = null;
let searchSeq = 0;

function onSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, SEARCH_DEBOUNCE_MS);
}

function dirNote(text) {
    document.getElementById('searchResults').innerHTML =
        '<div class="side-note">' + esc(text) + '</div>';
}

async function runSearch() {
    const q = document.getElementById('stdSearch').value.trim();
    const seq = ++searchSeq;
    const box = document.getElementById('searchResults');

    if (q.length < SEARCH_MIN_CHARS) {
        dirNote(t('directoryHint'));
        return;
    }

    dirNote(t('directorySearching'));
    try {
        const res = await fetch(API_BASE + '/api/search?q=' + encodeURIComponent(q) + '&k=8');
        const data = await res.json();
        if (seq !== searchSeq) return;
        if (!res.ok) throw new Error(data.error);
        if (!data.results.length) {
            dirNote(t('noResults'));
            return;
        }
        box.innerHTML = data.results
            .map((r) => {
                const pages = r.pages.length > 1 ? r.pages[0] + '–' + r.pages[1] : r.pages[0];
                const ask =
                    r.clause ? 'Tell me about ' + r.docTitle + ', clause ' + r.clause
                             : 'Tell me about ' + r.docTitle;
                return '<div class="dir-card" data-ask="' + esc(ask) + '">' +
                    '<div class="t">' + esc(r.docTitle) + '</div>' +
                    '<div class="m">' + esc('cl. ' + (r.clause || '—') + ' · p. ' + pages) + '</div>' +
                    '<div class="p">' + esc(r.preview.slice(0, 150)) + '…</div></div>';
            })
            .join('');
    } catch (err) {
        if (seq !== searchSeq) return;
        dirNote(t('directoryError'));
    }
}

/* ---------- header ---------- */

async function loadHealth() {
    const el = document.getElementById('runtimeLine');
    try {
        const res = await fetch(API_BASE + '/api/health');
        const d = await res.json();
        const c = d.config || {};
        // The active provider/model pair, read from the same config the server
        // runs on. It previously reported Gemini models on a fully local install,
        // which made it impossible to tell from the UI what was actually running.
        if (c.embedModel && c.genModel) {
            el.textContent = fill('runtimeLine', {
                embed: c.embedProvider + '/' + c.embedModel,
                gen: c.genProvider + '/' + c.genModel,
            });
        } else {
            el.textContent = t('runtimeUnknown');
        }

        if (d.corpus) {
            const pages = (d.corpus.documents || []).reduce((n, x) => n + (x.pageCount || 0), 0);
            document.getElementById('corpusLine').textContent = fill('corpusLine', {
                docs: (d.corpus.documents || []).map((x) => x.docTitle).join(', ') || '—',
                pages,
                chunks: d.corpus.chunkCount,
            });
        }
    } catch (err) {
        el.textContent = t('connError');
    }
}

function setLanguage(next) {
    lang = LANGS.includes(next) ? next : 'en';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
        const v = I18N[lang][el.getAttribute('data-i18n')];
        if (v) el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
        const v = I18N[lang][el.getAttribute('data-i18n-placeholder')];
        if (v) el.placeholder = v;
    });
    document.getElementById('topicNote').textContent = t('topicsNote');
    document.getElementById('stdSearch').placeholder = t('searchPlaceholder');
    // Relabelling the search box invalidates whatever it was showing.
    if (!document.getElementById('stdSearch').value.trim()) dirNote(t('directoryHint'));
    loadTopics();
    loadHealth();
    input.focus();
}

// setLanguage already fetches topics and health, so calling them again here
// doubled every request on first paint and on each language switch.
setLanguage('en');
emptyState();
</script>
