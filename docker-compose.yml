services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: bis-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: bis
      POSTGRES_PASSWORD: bis
      POSTGRES_DB: bis_rag
    ports:
      # Host 5433 -> container 5432, so this does not clash with any Postgres
      # you already run locally.
      - "5433:5432"
    volumes:
      - bis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bis -d bis_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bis_pgdata:
