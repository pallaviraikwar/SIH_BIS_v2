# The whole stack: Postgres+pgvector and the app. Two services.
#
#   ./scripts/ollama-host-setup.sh          once: bind Ollama, pull the models
#   docker compose up -d --build            bring the rest up
#   open http://localhost:3000
#
# Generation and embedding run in Ollama on the HOST, not in here. That is the
# whole point of `host.docker.internal` below, and the reasoning is in
# scripts/ollama-host-setup.sh. Short version: the host already has the models,
# and a second ollama service meant a second ~2.9 GB pull for the same weights
# plus a root-ownership trap around the model store.
#
# Read README.md "Prerequisites" first if `docker ps` gives you a permission
# error — that is a host group membership problem, not a problem with this file.

services:
  # ---------------------------------------------------------------- vector store
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: bis-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: bis
      POSTGRES_PASSWORD: bis
      POSTGRES_DB: bis_rag
    ports:
      # Host 5433 -> container 5432, so this does not clash with any Postgres
      # you already run locally. Published rather than kept internal because the
      # non-Docker path in the README, and psql, both talk to it directly.
      #
      # Overridable because 5433 is a popular port and this machine already has
      # something on it: `PG_HOST_PORT=5434 docker compose up -d`. Note that only
      # the *host* side moves — the app container reaches the database at
      # pgvector:5432 regardless, so the app needs no matching change.
      - "${PG_HOST_PORT:-5433}:5432"
    volumes:
      - bis_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits on this. It is the reason `app` does not boot, log
      # "Could not connect to Postgres", and carry on with an empty store.
      test: ["CMD-SHELL", "pg_isready -U bis -d bis_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- app
  app:
    build: .
    container_name: bis-app
    restart: unless-stopped
    # Tini as PID 1. Node does not leak children here, but it also does not
    # reap anything it inherits, and a compose file that grows a sidecar later
    # should not have to be rewritten to add `init: true`.
    init: true
    depends_on:
      pgvector:
        condition: service_healthy
    ports:
      - "3000:3000"
    # The container reaches the host's Ollama through this name.
    #
    # `host-gateway` is the part that matters, and it is Linux-only: Docker's
    # embedded DNS does not know this name on Linux (Docker Desktop for Mac and
    # Windows provide it themselves, which is why this is often missed until it
    # fails on the one machine that needed it). It maps the name to the bridge
    # gateway — 172.17.0.1 on the default bridge — which is the host's address
    # as seen from inside a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # Everything from .env, so local overrides still apply.
      #
      # required: false, because every value in it has a working default and a
      # missing .env should not stop the stack from booting — `cp .env.example
      # .env` is step two of the install, and compose would otherwise hard-fail on
      # anyone who skipped it or cloned fresh.
      - path: .env
        required: false
    environment:
      # These override .env, and `environment:` beats `env_file:` in Compose.
      # That precedence is the whole point of this block: .env ships pointing at
      # 127.0.0.1, which inside a container is the container.
      #
      # Service names, never 127.0.0.1 — Docker's embedded DNS resolves them.
      DATABASE_URL: postgres://bis:bis@pgvector:5432/bis_rag
      # Absolute, because config.js resolves PDF_DIR against process.cwd() (/app)
      # and the mount below is at /data/pdfs. .env's relative ./data/pdfs is
      # correct on the host and wrong in here — it would point at /app/data/pdfs,
      # which is empty, so ingest would find nothing and every citation would 404
      # while the corpus still answered.
      PDF_DIR: /data/pdfs
      # The host daemon, via the name extra_hosts provides. Requires
      # scripts/ollama-host-setup.sh to have been run: an Ollama bound to the
      # host's 127.0.0.1 is unreachable from here, and the symptom is a health
      # report that says the store is fine and then every answer failing with a
      # model connection error. run.sh checks for this before starting anything.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      # Not a tuning knob: correctness. Ollama's default context is 4096 and a
      # grounded prompt here is ~5,400-6,600 tokens. The daemon does not reject an
      # oversized prompt — it trims the evidence and still returns 200, so the
      # model answers from a third of the passages with nothing reporting a
      # problem. providers/ollama.js sends num_ctx per request regardless, but
      # this keeps the host daemon's default in agreement with it.
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      # Read-only. The app only ever reads PDFs from here — ingest reads them
      # and the citation route streams them — and mounting read-only means a
      # compromised container cannot rewrite the corpus. data/pdfs is
      # gitignored, so on a fresh clone this is an empty directory and ingest
      # has nothing to do: drop the PDFs in first.
      - ./data/pdfs:/data/pdfs:ro
      # Prepared index snapshots, so `docker compose run --rm app npm run
      # index:import` can load one instead of re-embedding the corpus on CPU.
      #
      # Read-write, and that is deliberate: the import only reads, but the
      # matching export writes, and one mount serving both directions means the
      # two commands cannot disagree about the path. `docker compose run` does
      # not publish ports, so this cannot collide with the app on 3000.
      - ./index-snapshots:/index-snapshots
    # Long enough for a SIGTERM to close the pool and exit on its own.
    stop_grace_period: 15s

volumes:
  bis_pgdata:
